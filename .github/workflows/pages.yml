name: Deploy Fuel Tracker Dev to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-shared-environments"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/#maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production snapshot
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout UAT snapshot
        uses: actions/checkout@v6
        with:
          ref: uat
          path: uat-src

      - name: Checkout Dev snapshot
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Assemble shared Pages site
        run: |
          mkdir -p site site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' prod-src/ site/
          mkdir -p site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' uat-src/ site/uat/
          rsync -a --delete --exclude='.git' --exclude='.github' dev-src/ site/dev/

      - name: Build DEV PWA icon sizes from approved artwork
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          src="site/dev/assets/branding/fueltracker-dev-icon-180.png"
          master=Image.open(src).convert("RGB")
          master.load()
          for size in (180,192,512):
              out=master if size == 180 else master.resize((size,size), Image.Resampling.LANCZOS)
              out.save(f"site/dev/assets/branding/fueltracker-dev-icon-{size}.png", "PNG", optimize=True)
          PY
          test -s site/dev/assets/branding/fueltracker-dev-icon-180.png
          test -s site/dev/assets/branding/fueltracker-dev-icon-192.png
          test -s site/dev/assets/branding/fueltracker-dev-icon-512.png

      - name: Build UAT PWA icon sizes from approved artwork (when available)
        run: |
          if [ -s site/uat/assets/branding/fueltracker-uat-icon-180.png ]; then
            python3 - <<'PY'
          from PIL import Image
          src="site/uat/assets/branding/fueltracker-uat-icon-180.png"
          master=Image.open(src).convert("RGB")
          master.load()
          for size in (180,192,512):
              out=master if size == 180 else master.resize((size,size), Image.Resampling.LANCZOS)
              out.save(f"site/uat/assets/branding/fueltracker-uat-icon-{size}.png", "PNG", optimize=True)
          PY
            test -s site/uat/assets/branding/fueltracker-uat-icon-192.png
            test -s site/uat/assets/branding/fueltracker-uat-icon-512.png
          else
            echo "::notice::Approved UAT icon source not present; preserving existing UAT assets and continuing deployment."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload shared Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy shared Fuel Tracker site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
