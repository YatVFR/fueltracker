name: Deploy Fuel Tracker Dev to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-shared-environments"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/#maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production snapshot
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout UAT snapshot
        uses: actions/checkout@v6
        with:
          ref: uat
          path: uat-src

      - name: Checkout Dev snapshot
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Assemble shared Pages site
        run: |
          mkdir -p site site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' prod-src/ site/
          mkdir -p site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' uat-src/ site/uat/
          rsync -a --delete --exclude='.git' --exclude='.github' dev-src/ site/dev/

      - name: Build DEV PWA icon set
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 - <<'PY'
          from PIL import Image
          from collections import deque
          src=Image.open("site/dev/assets/branding/fueltracker-dev-icon-192.png").convert("RGB")
          px=src.load(); w,h=src.size
          seen=set(); q=deque([(0,0),(w-1,0),(0,h-1),(w-1,h-1)])
          def light(c): return min(c)>180 and max(c)-min(c)<55
          while q:
              x,y=q.popleft()
              if (x,y) in seen or not (0<=x<w and 0<=y<h): continue
              seen.add((x,y))
              if not light(px[x,y]): continue
              px[x,y]=(2,7,13)
              q.extend(((x+1,y),(x-1,y),(x,y+1),(x,y-1)))
          for size in (180,192,512):
              src.resize((size,size),Image.Resampling.LANCZOS).save(
                  f"site/dev/assets/branding/fueltracker-dev-icon-{size}.png", optimize=True)
          PY
          test -s site/dev/assets/branding/fueltracker-dev-icon-180.png
          test -s site/dev/assets/branding/fueltracker-dev-icon-192.png
          test -s site/dev/assets/branding/fueltracker-dev-icon-512.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload shared Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy shared Fuel Tracker site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
