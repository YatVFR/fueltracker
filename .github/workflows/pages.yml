name: Deploy Fuel Tracker Dev to GitHub Pages

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-shared-environments"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dev/#maintenance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Production snapshot
        uses: actions/checkout@v6
        with:
          ref: main
          path: prod-src

      - name: Checkout UAT snapshot
        uses: actions/checkout@v6
        with:
          ref: uat
          path: uat-src

      - name: Checkout Dev snapshot
        uses: actions/checkout@v6
        with:
          ref: dev
          path: dev-src

      - name: Assemble shared Pages site
        run: |
          mkdir -p site site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' prod-src/ site/
          mkdir -p site/uat site/dev
          rsync -a --delete --exclude='.git' --exclude='.github' uat-src/ site/uat/
          rsync -a --delete --exclude='.git' --exclude='.github' dev-src/ site/dev/

      - name: Build DEV PWA icon set
        run: |
          ICON="site/dev/assets/branding/fueltracker-dev-icon-192.png"
          TOOL="$(command -v magick || command -v convert)"
          test -n "$TOOL"
          "$TOOL" "$ICON" -fuzz 22% -fill '#02070d' -draw 'color 0,0 floodfill' -resize 180x180 site/dev/assets/branding/fueltracker-dev-icon-180.png
          "$TOOL" "$ICON" -fuzz 22% -fill '#02070d' -draw 'color 0,0 floodfill' -resize 192x192 site/dev/assets/branding/fueltracker-dev-icon-192.png
          "$TOOL" "$ICON" -fuzz 22% -fill '#02070d' -draw 'color 0,0 floodfill' -resize 512x512 site/dev/assets/branding/fueltracker-dev-icon-512.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload shared Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Deploy shared Fuel Tracker site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
